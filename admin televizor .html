<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'"><title>Bistro Appetitus – Administrare</title><style>*{box-sizing:border-box}body{background:#171717;color:#fff;font:17px Arial;max-width:800px;margin:auto;padding:20px}h1,h2,a{color:#ffd034}label{display:block;margin:12px 0}input{width:100%;padding:12px;background:#292929;color:#fff;border:1px solid #777;border-radius:8px;font:16px Arial}button{padding:12px;border:0;border-radius:8px;background:#ffd034;color:#171717;font:bold 16px Arial;margin:8px 0}button:disabled{opacity:.5}.item{display:grid;grid-template-columns:1fr 80px 42px;gap:8px;align-items:center;margin:8px 0}section{border-bottom:1px solid #555;padding-bottom:15px}#status{white-space:pre-wrap}</style></head><body><h1>Bistro Appetitus – Administrare</h1><p>Modifică preparatele și prețurile.</p><main id="form"></main><section><h2>Publicare autorizată</h2><label>Cheia GitHub<input id="token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false"></label><p>Cheia este transmisă doar către API-ul GitHub și nu este salvată de pagină. Introdu cheia numai pe pagina oficială a proiectului, după verificarea codului.</p><button id="publish" disabled>Publică pe televizoare</button><p id="status" role="status"></p></section><p><a href="index.html">Înapoi la televizoare</a></p><script>
const api='https://api.github.com/repos/icristi24/bistro-appetitus-digital/contents/data.json';let data,baseline;const form=document.getElementById('form'),statusEl=document.getElementById('status'),pub=document.getElementById('publish'),token=document.getElementById('token');
function el(tag,parent,txt){const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;parent.append(x);return x}
function field(parent,label,obj,key,num=false){const l=el('label',parent,label);const i=el('input',l);i.value=obj[key]??'';if(num){i.type='number';i.min='0';i.step='0.01'}i.oninput=()=>obj[key]=num?(i.value===''?null:Number(i.value)):i.value}
function section(title){const s=el('section',form);el('h2',s,title);return s}
function render(){form.replaceChildren();let s=section('Meniul zilei');field(s,'Preț (lei)',data.daily,'price',true);field(s,'Preț cu ciorbă de burtă (lei)',data.daily,'tripePrice',true);field(s,'Descriere',data.daily,'description');for(const [key,title] of [['soups','Ciorbe'],['mains','Feluri principale']]){s=section(title);data[key].forEach((o,j)=>{const row=el('div',s);row.className='item';const n=el('input',row);n.value=o.name;n.setAttribute('aria-label','Preparat '+(j+1));n.oninput=()=>o.name=n.value;const p=el('input',row);p.type='number';p.min='0';p.step='0.01';p.value=o.price;p.setAttribute('aria-label','Preț în lei');p.oninput=()=>o.price=p.value===''?null:Number(p.value);const b=el('button',row,'×');b.setAttribute('aria-label','Șterge preparatul');b.onclick=()=>{data[key].splice(j,1);render()}});el('button',s,'+ Adaugă preparat').onclick=()=>{data[key].push({name:'',price:0});render()}}s=section('Oferte și livrare');for(const [k,l] of Object.entries({phone:'Telefon',hours:'Program livrare',free:'Livrare gratuită',takeaway:'La pachet',city:'Oraș'}))field(s,l,data.offers,k)}
function decode(s){return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))}function encode(s){return btoa(Array.from(new TextEncoder().encode(s),b=>String.fromCharCode(b)).join(''))}
async function req(method,key,body){const res=await fetch(api+(method==='GET'?'?ref=main&t='+Date.now():''),{method,redirect:'error',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+key,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!res.ok)throw Error('GitHub: '+res.status);return res.json()}
async function load(){try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();data=await r.json();baseline=JSON.stringify(data);render();pub.disabled=false}catch{statusEl.textContent='Nu s-au putut încărca meniurile. Reîncarcă pagina.'}}
pub.onclick=async()=>{const key=token.value.trim();if(!key){statusEl.textContent='Introdu cheia GitHub.';return}if(![data.daily.price,data.daily.tripePrice,...data.soups.map(x=>x.price),...data.mains.map(x=>x.price)].every(x=>Number.isFinite(x)&&x>=0)||![...data.soups,...data.mains].every(x=>x.name.trim())){statusEl.textContent='Completează toate denumirile și prețurile corect.';return}pub.disabled=true;form.inert=true;statusEl.textContent='Se publică…';try{const current=await req('GET',key);if(JSON.stringify(JSON.parse(decode(current.content)))!==baseline)throw Error('Meniul a fost modificat între timp. Reîncarcă pagina înainte de publicare.');const snapshot=JSON.stringify(data,null,2);await req('PUT',key,{message:'Actualizare meniuri Bistro Appetitus',content:encode(snapshot+'\n'),sha:current.sha,branch:'main'});baseline=JSON.stringify(data);statusEl.textContent='Meniul a fost salvat pe GitHub. Așteaptă publicarea GitHub Pages și actualizarea televizoarelor.'}catch(e){statusEl.textContent='Publicarea nu a reușit: '+e.message}finally{token.value='';pub.disabled=false;form.inert=false}};load();
</script></body></html>
